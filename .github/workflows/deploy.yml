name: Build & Deploy OdyStorm to VPS

on:
  push:
    branches:
      - v2-web
      - main
  workflow_dispatch:

concurrency:
  group: odystorm-vps-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript checks across workspace
        run: bun run typecheck

      - name: Run Bun backend & economy test suite
        run: bun test apps/api/tests/api.test.ts

      - name: Verify Next.js production build
        env:
          NEXT_PUBLIC_APP_URL: https://odystorm.auralist.vip
          NEXT_PUBLIC_WS_URL: wss://odystorm.auralist.vip/ws
        run: bun run build

  deploy:
    name: Deploy to odystorm.auralist.vip
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync release to VPS (preserving SQLite data & .env)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "mkdir -p /var/www/odystorm/data"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'node_modules/' \
            --exclude 'apps/web/.next/' \
            ./ "${VPS_USER}@${VPS_HOST}:/var/www/odystorm/"

      - name: Build & restart services on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" 'bash -se' << 'EOF'
            set -euo pipefail
            export PATH="/usr/local/bin:$HOME/.bun/bin:$PATH"
            bash /var/www/odystorm/deploy/setup-vps.sh

            set -a
            source /var/www/odystorm/.env
            set +a

            cd /var/www/odystorm
            bun install
            bun run --cwd apps/api db:seed
            bun run --cwd apps/web build

            systemctl restart odystorm-api.service
            systemctl restart odystorm-web.service

            for i in {1..15}; do
              if curl -sf "http://127.0.0.1:${API_PORT:-4410}/api/health" >/dev/null && \
                 curl -sf "http://127.0.0.1:${PORT:-3410}" >/dev/null; then
                echo "==> OdyStorm API and Web services are healthy!"
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: Service health check timed out."
            journalctl -u odystorm-api.service -n 30 --no-pager || true
            journalctl -u odystorm-web.service -n 30 --no-pager || true
            exit 1
          EOF
